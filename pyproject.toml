[build-system]
requires = [
  "meson-python>=0.13",
  "numpy>=2.0",
  "meson>=1.0.0",
  "ninja>=1.0.0"
]
build-backend = "mesonpy"

[project]
name = "outflowpy"
version = "0.0.1"
description = "Outflow field modelling"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.meson-python]
module-name = "outflowpy"
