[build-system]
requires = [
  "meson-python",
  "meson>=1.0.0",
  "ninja",
  "numpy>=2.0"
]
build-backend = "mesonpy"

[project]
name = "outflowpy"
version = "0.0.3"
description = "Outflow Field Modelling"
requires-python = ">=3.9"
dependencies = ["numpy",  "astropy", "matplotlib","sunpy","reproject","mpl_animators","bs4","lxml","zeep","drms","scikit-image", "pyvista", "streamtracer", "sympy"]

[tool.meson-python]
limited-api = false
