name: Build Linux Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      # Step 3: Install dependencies and GCC for Fortran
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python -m pip install --upgrade pip
          pip install numpy build wheel

      # Step 4: Set OpenMP flags for Linux
      - name: Set OpenMP environment
        shell: bash
        run: |
          export OPENMP_FLAGS="--f90flags=-fopenmp -lgomp"
          echo "OPENMP_FLAGS=$OPENMP_FLAGS" >> $GITHUB_ENV
          echo "OpenMP flags: $OPENMP_FLAGS"

      # Step 5: Build the wheel
      - name: Build wheel
        shell: bash
        run: python -m build --wheel

      # Step 6: Upload wheel as artifact
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheels
          path: dist/*.whl
