name: Build outflowpy wheels

# Trigger on push to tags or manual run
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Step 1: Checkout code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"  # or 3.9, 3.11
          cache: "pip"

      # Step 3: Install build dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy build

      - name: Install Homebrew dependencies (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export FC=gfortran
          echo "FC=gfortran" >> $GITHUB_ENV

      - name: Check Fortran compiler
        if: runner.os == 'macOS'
        run: |
          which gfortran
          gfortran --version
          echo "FC=gfortran" >> $GITHUB_ENV
          echo "OPENMP_FLAGS=$OPENMP_FLAGS" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Set OpenMP & Fortran environment
        shell: bash
        run: |
          if [[ "$(uname)" == "Linux" ]]; then
            export OPENMP_FLAGS="--f90flags=-fopenmp -lgomp"
          elif [[ "$(uname)" == "Darwin" ]]; then
            export FC=gfortran
            export OPENMP_FLAGS="--f90flags=-Xpreprocessor -fopenmp -lomp"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            set OPENMP_FLAGS="--f90flags=/openmp"
          fi
            echo "FC=${FC:-}" >> $GITHUB_ENV
            echo "OPENMP_FLAGS=$OPENMP_FLAGS" >> $GITHUB_ENV
            echo "OpenMP flags: $OPENMP_FLAGS"



      # Step 4: Build the wheel
      - name: Build wheel
        shell: bash
        run: python -m build --wheel

      # Step 5: Upload wheels as artifact
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
