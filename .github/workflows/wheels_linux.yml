name: Build Wheels

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.9, 3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel numpy meson ninja
      # Build Fortran .so manually with f2py
      - run: |
          python -m numpy.f2py -c fortran/outflow_calc.f90 -m outflow_calc
          python -m numpy.f2py -c fortran/fast_tracer.f90 -m fast_tracer
          mkdir -p outflowpy
          mv outflow_calc*.so outflowpy/
          mv fast_tracer*.so outflowpy/
      # Build the wheel using cibuildwheel
      - uses: pypa/cibuildwheel@v3.3.1
        with:
          output-dir: wheelhouse
