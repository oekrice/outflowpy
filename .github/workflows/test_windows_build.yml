name: Minimal Windows Build Test

on:
  #push:
  #  branches: [main, master]
  #pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (host, not build env)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'
      
      - name: Verify Fortran installation
        run: |
          gfortran --version
          where gfortran
          
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          
      - name: Build wheels
        env:
          CIBW_SKIP: "*-win32"
          CIBW_BUILD: "cp313-win_amd64"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BEFORE_BUILD: "python -c \"import subprocess; subprocess.run(['gfortran', '--version'])\""
        run: |
          python -m cibuildwheel --output-dir wheelhouse
          
      - name: Check wheel contents and test Fortran module imports
        run: |
          $wheel = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1
          
          # Show what's in the wheel file itself
          echo "=== WHEEL CONTENTS ==="
          python -m zipfile -l $wheel.FullName
          
          # Install numpy first
          python -m pip install numpy
          
          # Install wheel with verbose output
          echo "=== INSTALLING WHEEL ==="
          python -m pip install --force-reinstall --verbose $wheel.FullName

          #Change to temporary directory
          cd /tmp
          
          # Show package location and ALL files (including .pyd)
          echo "=== INSTALLED FILES ==="
          python -c "import outflowpy, os, glob; pkg_dir = os.path.dirname(outflowpy.__file__); print('Package dir:', pkg_dir); all_files = os.listdir(pkg_dir); print('All files:', sorted(all_files)); pyd_files = glob.glob(os.path.join(pkg_dir, '*.pyd')); print('PYD files found:', pyd_files)"
          
          # Check if they exist but can't be imported
          echo "=== CHECKING PYD FILES DIRECTLY ==="
          python -c "import os; pkg_dir = r'D:\a\outflowpy\outflowpy\outflowpy'; print('outflow_calc.pyd exists:', os.path.exists(os.path.join(pkg_dir, 'outflow_calc.cp313-win_amd64.pyd'))); print('fast_tracer.pyd exists:', os.path.exists(os.path.join(pkg_dir, 'fast_tracer.cp313-win_amd64.pyd')))"
          
          # Try importing with full names
          echo "=== TESTING IMPORTS ==="
          python -c "try:`n    import outflowpy.outflow_calc`n    print('SUCCESS')`nexcept Exception as e:`n    print('FAILED:', e)"
          python -c "try:`n    import outflowpy.fast_tracer`n    print('SUCCESS')`nexcept Exception as e:`n    print('FAILED:', e)"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name:  wheels-${{ runner.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
