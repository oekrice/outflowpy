name: Test Windows Compilation

on:
  #push:
  #  branches: [main, master]
  #pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (host, not build env)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'
      
      - name: Verify Fortran installation
        run: |
          gfortran --version
          where gfortran
          
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          
      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_SKIP: "*-win32"
          CIBW_BUILD: "cp313-win_amd64"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BEFORE_BUILD: "python -c \"import subprocess; subprocess.run(['gfortran', '--version'])\""

      - name: Check wheel contents
        run: |
          python -m pip install wheelhouse/*.whl
          python -c "import outflowpy; print(dir(outflowpy)); import os; print(os.listdir(os.path.dirname(outflowpy.__file__)))"
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name:  wheels-${{ runner.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
