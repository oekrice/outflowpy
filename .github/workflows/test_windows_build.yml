name: Test Windows Compilation

on:
  #push:
  #  branches: [main, master]
  #pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (host, not build env)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'
      
      - name: Verify Fortran installation
        run: |
          gfortran --version
          where gfortran
          
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
          
      - name: Build wheels
        env:
          CIBW_SKIP: "*-win32"
          CIBW_BUILD: "cp313-win_amd64"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BEFORE_BUILD: "python -c \"import subprocess; subprocess.run(['gfortran', '--version'])\""
        run: |
          python -m cibuildwheel --output-dir wheelhouse
          
      - name: Check wheel contents and test Fortran module imports
        run: |
          $wheel = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1
          python -m pip install numpy
          python -m pip install $wheel.FullName
          
          # Show what's in the wheel file itself
          echo "=== WHEEL CONTENTS ==="
          python -m zipfile -l $wheel.FullName
          
          # Show package location and contents
          echo "=== PACKAGE LOCATION AND CONTENTS ==="
          python -c "import outflowpy, os; print('Package location:', outflowpy.__file__); pkg_dir = os.path.dirname(outflowpy.__file__); print('Package dir contents:', os.listdir(pkg_dir)); subdirs = [d for d in os.listdir(pkg_dir) if os.path.isdir(os.path.join(pkg_dir, d))]; print('Subdirectories:', subdirs); [print(f'Contents of {d}:', os.listdir(os.path.join(pkg_dir, d))) for d in subdirs if d != '__pycache__']"
          
          # Show what's importable from outflowpy
          echo "=== OUTFLOWPY MODULE CONTENTS ==="
          python -c "import outflowpy; print('dir(outflowpy):', [x for x in dir(outflowpy) if not x.startswith('_')])"
          
          # Show __init__.py contents
          echo "=== __INIT__.PY CONTENTS ==="
          python -c "import outflowpy, os; init_file = outflowpy.__file__; print(open(init_file).read())"
          
          # Try different import paths
          echo "=== TESTING IMPORT PATHS ==="
          python -c "try: from outflowpy import outflow_calc; print('SUCCESS: from outflowpy import outflow_calc'); print('Contents:', dir(outflow_calc)); except Exception as e: print('FAILED: from outflowpy import outflow_calc -', e)"
          python -c "try: from outflowpy import fast_tracer; print('SUCCESS: from outflowpy import fast_tracer'); print('Contents:', dir(fast_tracer)); except Exception as e: print('FAILED: from outflowpy import fast_tracer -', e)"
          python -c "try: from outflowpy.fortran import outflow_calc; print('SUCCESS: from outflowpy.fortran import outflow_calc'); except Exception as e: print('FAILED: from outflowpy.fortran import outflow_calc -', e)"
          python -c "try: from outflowpy.fortran import fast_tracer; print('SUCCESS: from outflowpy.fortran import fast_tracer'); except Exception as e: print('FAILED: from outflowpy.fortran import fast_tracer -', e)"
          python -c "try: import outflowpy.outflow_calc; print('SUCCESS: import outflowpy.outflow_calc'); except Exception as e: print('FAILED: import outflowpy.outflow_calc -', e)"
          python -c "try: import outflowpy.fast_tracer; print('SUCCESS: import outflowpy.fast_tracer'); except Exception as e: print('FAILED: import outflowpy.fast_tracer -', e)"
            
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name:  wheels-${{ runner.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
