name: Test Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:  # Allows manual triggering

jobs:
  test_build:
    name: Test build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel meson numpy
      
      - name: Build wheels with cibuildwheel
        run: |
          # Use Meson to build your .so modules
          meson setup build
          meson compile -C build
          
          # cibuildwheel needs output dir
          mkdir -p dist
          
          # Copy the built .so files into cibuildwheel output dir
          cp build/fortran/outflow_calc*.so dist/
          cp build/fortran/fast_tracer*.so dist/
          
          # Build wheels in manylinux format
          cibuildwheel --output-dir dist
          
      - name: Install from wheel
        run: |
          pip install dist/*.whl
      
      - name: Test imports
        run: |
          cd /tmp
          python -c "from outflowpy import outflow_calc, fast_tracer; print('Import successful!')"
          python -c "import outflowpy; print(outflowpy.__file__)"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
