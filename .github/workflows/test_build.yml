name: Build Manylinux Wheels

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build and test wheels on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      # Step 1: Checkout repository
      - uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install gfortran and build tools
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran meson ninja-build
          python -m pip install --upgrade pip
          pip install cibuildwheel numpy

      # Step 4: Build wheels using cibuildwheel (manylinux compliant)
      - name: Build manylinux wheels
        run: |
          # cibuildwheel will build in a manylinux Docker environment
          # CIBW_BUILD can be set to custom build commands
          export CIBW_BUILD=": meson setup build && meson compile -C build"
          cibuildwheel --output-dir dist

      # Step 5: Test installation of the wheel
      - name: Install wheel and test imports
        run: |
          python -m pip install --upgrade dist/*.whl
          python -c "from outflowpy import outflow_calc, fast_tracer; print('Import successful!')"

      # Step 6: Upload artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/
