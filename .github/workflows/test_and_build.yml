name: Test and Build

on:
  #push:
  #  branches: [main, master]
  #pull_request:
  workflow_dispatch:

jobs:
  run_pytest-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build pytest

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Test imports
        run: |
          cd /tmp
          python -c "from outflowpy import outflow_calc, fast_tracer; print('Imports work!')"
          python -c "import outflowpy; print(f'Installed at: {outflowpy.__file__}')"

      - name: Run tests from checkout
        run: |
          # Copy tests to a temp location, so they use the correct package (rather than the local file)
          cp -r tests /tmp/tests
          # Run from there - will use installed package
          cd /tmp
          python -m pytest tests/ -v

  test-windows-build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (host, not build env)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'

      - name: Verify Fortran installation
        run: |
          gfortran --version
          where gfortran

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_SKIP: "*-win32"
          CIBW_BUILD: "cp312-win_amd64"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BEFORE_BUILD: "python -c \"import subprocess; subprocess.run(['gfortran', '--version'])\""
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Check wheel contents and test Fortran module imports
        run: |
          $wheel = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1

          # Show what's in the wheel file itself
          echo "=== WHEEL CONTENTS ==="
          python -m zipfile -l $wheel.FullName

          # Install numpy first
          python -m pip install numpy

          # Install wheel with verbose output
          echo "=== INSTALLING WHEEL ==="
          python -m pip install --force-reinstall --verbose $wheel.FullName

          #Change to temporary directory
          cd $env:TEMP

          # Show package location and ALL files (including .pyd)
          echo "=== INSTALLED FILES ==="
          python -c "import outflowpy, os, glob; pkg_dir = os.path.dirname(outflowpy.__file__); print('Package dir:', pkg_dir); all_files = os.listdir(pkg_dir); print('All files:', sorted(all_files)); pyd_files = glob.glob(os.path.join(pkg_dir, '*.pyd')); print('PYD files found:', pyd_files)"

          # Try importing with full names
          echo "=== TESTING IMPORTS ==="
          python -c "import outflowpy.outflow_calc; print('outflow_calc imported successfully')"
          python -c "import outflowpy.fast_tracer; print('fast_tracer imported successfully')"



  build-all_wheels:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (host, not build env)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Fortran (Linux)
        if: runner.os == 'Linux'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'

      - name: Set up Fortran (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use Homebrew's gcc which should have better compatibility
          brew install gcc@13
          # Set to use this specific version
          echo "FC=$(brew --prefix gcc@13)/bin/gfortran-13" >> $GITHUB_ENV
          
      - name: Set up Fortran (Windows)
        if: runner.os == 'Windows'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Get gfortran path (Windows)
        if: runner.os == 'Windows'
        id: gfortran
        shell: pwsh
        run: |
          $gfortranDir = Split-Path (Get-Command gfortran).Source
          echo "dir=$gfortranDir" >> $env:GITHUB_OUTPUT
    
      - name: Build wheels (Linux)
        if: runner.os == 'linux'
        run: |
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-*
          
      - name: Build wheels (macOS)
        if: runner.os == 'macOS'
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-*
          CIBW_BEFORE_BUILD: brew install gcc@12
          CIBW_ENVIRONMENT: MACOSX_DEPLOYMENT_TARGET=14.0 FC=gfortran-12 F90=gfortran-12 F77=gfortran-12
          
      - name: Build wheels (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_SKIP: "*-win32"
          CIBW_BUILD: "cp313-win_amd64 cp312-win_amd64"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_BEFORE_BUILD: "python -c \"import subprocess; subprocess.run(['gfortran', '--version'])\""
          CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path ${{ steps.gfortran.outputs.dir }} -w {dest_dir} {wheel}"
          
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name:  wheels-${{ runner.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
