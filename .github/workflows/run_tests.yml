name: Test Outflowpy imports and pytests

on:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build pytest
      
      - name: Build wheel
        run: python -m build --wheel
      
      - name: Install wheel
        run: pip install dist/*.whl
      
      - name: Test imports
        run: |
          cd /tmp
          python -c "from outflowpy import outflow_calc, fast_tracer; print('Imports work!')"
          python -c "import outflowpy; print(f'Installed at: {outflowpy.__file__}')"
      
      - name: Run tests from checkout
        run: |
          # Copy tests to a temp location, so they use the correct package (rather than the local file)
          cp -r outflowpy/tests /tmp/tests
          # Run from there - will use installed package
          cd /tmp
          python -m pytest tests/ -v
