name: Build Linux and macOS files

on:
  #push:
  #  branches: [main, master]
  #pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (host, not build env)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Fortran
        if: runner.os == 'Linux'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 'latest'

      - name: Set up Fortran (macOS)
        if: runner.os == 'macOS'
        run: |
          # Use Homebrew's gcc which should have better compatibility
          brew install gcc@13
          # Set to use this specific version
          echo "FC=$(brew --prefix gcc@13)/bin/gfortran-13" >> $GITHUB_ENV

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0 FC=/opt/homebrew/opt/gcc@13/bin/gfortran-13"
        run: |
          python -m cibuildwheel --output-dir wheelhouse
          
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name:  wheels-${{ runner.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl
